plugins {
    id 'com.android.application'
}

android {
    namespace 'br.escudo.antispoiler'
    compileSdk 35

    defaultConfig {
        applicationId 'br.escudo.antispoiler'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de depuração para dar para instalar direto, sem criar chave própria.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Leitura de texto dentro de imagens (miniaturas, Reels, Shorts), 100% no celular.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
