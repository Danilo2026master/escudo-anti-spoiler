plugins {
    id 'com.android.application'
}

android {
    namespace 'br.escudo.antispoiler'
    compileSdk 35

    defaultConfig {
        applicationId 'br.escudo.antispoiler'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de depuração para dar para instalar direto, sem criar chave própria.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// Sem bibliotecas extras: o app usa só o que já vem no Android.
